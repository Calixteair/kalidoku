title = "kalidoku gitleaks config"

[allowlist]
description = "Files allowlisted from secret scanning"
paths = [
  "infra/bao/agent.hcl",          # template, no real values
  "infra/bao/setup.md",           # explains commands, no real secrets
  "infra/docker/compose.dev.yaml" # dev creds explicitly weak
]

[[rules]]
id    = "generic-api-key"
description = "Generic API key pattern"
regex = '''(?i)(api[_-]?key|secret|token|password)\s*[:=]\s*['"]?[A-Za-z0-9+/=_-]{24,}'''
