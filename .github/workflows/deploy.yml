name: deploy

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-prod
  cancel-in-progress: false

jobs:
  deploy-vps:
    name: SSH ci-kalidoku → bao-deploy.sh
    runs-on: ubuntu-24.04
    environment:
      name: production
      url: https://kalidoku.calixteair.fr
    steps:
      - name: Trigger remote deploy
        # Native ssh instead of a third-party action: the VPS host key is pinned
        # (StrictHostKeyChecking=yes), so the job refuses any other server (anti-MITM).
        # ForceCommand côté serveur ignore toute commande et lance ci-deploy-self.sh.
        # Voir wiki [[vps-ci-deployers-pattern]].
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          # Public host key of srv470430 (not a secret). Update it if the VPS host key is rotated.
          KNOWN_HOST: vps-calixteair ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIA1YMD+MmFX6DQwYbIu8Reuhwl9if0IMoJp4gGHyo/Pg
        run: |
          set -euo pipefail
          install -d -m 700 ~/.ssh
          trap 'rm -f ~/.ssh/deploy_key' EXIT
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$KNOWN_HOST" > ~/.ssh/known_hosts
          timeout 5m ssh -T -i ~/.ssh/deploy_key -p "$DEPLOY_PORT" \
            -o HostKeyAlias=vps-calixteair -o StrictHostKeyChecking=yes \
            -o IdentitiesOnly=yes -o BatchMode=yes \
            "$DEPLOY_USER@$DEPLOY_HOST"

      - name: Smoke test
        run: |
          set -euo pipefail
          for i in 1 2 3 4 5; do
            sleep 10
            STATUS=$(curl -fsS https://kalidoku.calixteair.fr/api/health | jq -r .status || echo "fail")
            if [[ "$STATUS" == "ok" ]]; then
              echo "deploy verified: status=ok"
              exit 0
            fi
            echo "attempt $i: status=$STATUS"
          done
          echo "deploy failed smoke test"
          exit 1
