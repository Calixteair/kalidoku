name: release-please

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-24.04
    steps:
      - uses: googleapis/release-please-action@v4
        with:
          release-type: simple
          target-branch: main
          # Pas de tag ni de release GitHub par le bot : la prod part d'un tag vX.Y.Z signé par
          # Calixteair (git tag -s), après le merge de la PR de version (CHANGELOG, manifest).
          skip-github-release: true
