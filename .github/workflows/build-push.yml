name: build-push

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write   # OIDC pour OpenBao (récupération du token Docker Hub)

concurrency:
  group: build-push-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-push:
    name: build + push ${{ matrix.image }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: kalidoku-server
            dockerfile: infra/docker/Dockerfile.server
          - image: kalidoku-worker
            dockerfile: infra/docker/Dockerfile.worker
          - image: kalidoku-web
            dockerfile: infra/docker/Dockerfile.web

    steps:
      - uses: actions/checkout@v4

      - name: Import secrets from OpenBao via OIDC
        id: bao
        uses: hashicorp/vault-action@v3
        with:
          url: https://secrets.calixteair.fr
          method: jwt
          path: jwt
          role: gha-kalidoku
          tlsSkipVerify: false
          secrets: |
            secret/data/cicd/dockerhub username | DH_USER ;
            secret/data/cicd/dockerhub token    | DH_TOKEN

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ env.DH_USER }}
          password: ${{ env.DH_TOKEN }}

      - name: Compute tags
        id: tags
        run: |
          set -euo pipefail
          SHA="sha-$(echo "${{ github.sha }}" | cut -c1-7)"
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            VERSION="${{ github.ref_name }}"
            echo "tags=calixteair/${{ matrix.image }}:latest,calixteair/${{ matrix.image }}:${SHA},calixteair/${{ matrix.image }}:${VERSION}" >> "$GITHUB_OUTPUT"
          else
            echo "tags=calixteair/${{ matrix.image }}:latest,calixteair/${{ matrix.image }}:${SHA}" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and push
        id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,scope=${{ matrix.image }},mode=max
          provenance: false

      - name: Trivy scan published image
        uses: aquasecurity/trivy-action@0.35.0
        with:
          image-ref: calixteair/${{ matrix.image }}@${{ steps.push.outputs.digest }}
          severity: CRITICAL
          exit-code: "1"
          ignore-unfixed: true

  trigger-deploy:
    name: trigger remote deploy
    needs: build-push
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    uses: ./.github/workflows/deploy.yml
    secrets: inherit
