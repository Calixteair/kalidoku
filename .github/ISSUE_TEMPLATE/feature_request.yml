name: Feature request
description: Propose a new feature
labels: [enhancement, triage]
body:
  - type: textarea
    id: motivation
    attributes:
      label: Motivation
      description: What problem does this solve?
    validations: { required: true }

  - type: textarea
    id: proposal
    attributes:
      label: Proposal
    validations: { required: true }

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered

  - type: dropdown
    id: surface
    attributes:
      label: Touches
      multiple: true
      options: [core, server, worker, web, contracts, infra, domains, docs]
    validations: { required: true }

  - type: checkboxes
    id: agreement
    attributes:
      label: Constraints
      options:
        - label: I read CLAUDE.md and agree with the project conventions.
          required: true
