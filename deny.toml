# cargo-deny configuration for kalidoku.
# Run locally: `cargo deny check`
# Docs:        https://embarkstudios.github.io/cargo-deny/

# ---------------------------------------------------------------------------
# Graph: which deps to consider.
# ---------------------------------------------------------------------------
[graph]
all-features = true
no-default-features = false
# Project targets x86_64 Linux on prod (distroless) and the local dev hosts.
targets = [
    "x86_64-unknown-linux-gnu",
    "aarch64-unknown-linux-gnu",
]

# ---------------------------------------------------------------------------
# Output verbosity.
# ---------------------------------------------------------------------------
[output]
feature-depth = 1

# ---------------------------------------------------------------------------
# Advisories — RUSTSEC database checks.
# ---------------------------------------------------------------------------
[advisories]
db-path = "$CARGO_HOME/advisory-db"
db-urls = ["https://github.com/rustsec/advisory-db"]
# Hard-fail on actively known vulnerabilities and unmaintained-flagged crates.
yanked = "deny"
# Per-id ignores (use with care — must include rationale + revisit date).
ignore = [
    # Tracked in #41 — bump openidconnect 3.5 → 4.x (drops rustls 0.21 chain).
    # Acceptable risk: kalidoku only validates id_tokens via Keycloak JWKS, no
    # custom TLS authority chains. Revisit before v1.0.0.
    { id = "RUSTSEC-2026-0098", reason = "rustls-webpki 0.101 via openidconnect 3.5 — see #41" },
    { id = "RUSTSEC-2026-0099", reason = "rustls-webpki 0.101 via openidconnect 3.5 — see #41" },
    { id = "RUSTSEC-2026-0104", reason = "rustls-webpki 0.101 via openidconnect 3.5 — see #41" },
    { id = "RUSTSEC-2025-0134", reason = "rustls-pemfile unmaintained via openidconnect 3.5 — see #41" },
    # Transitive advisories with no fixed upgrade available — accepted risk:
    # we don't expose the affected attack surface (no key generation in user
    # input path, no untrusted RSA signing), to revisit when upstream patches.
    { id = "RUSTSEC-2023-0071", reason = "rsa Marvin timing via sqlx-mysql — no fix; not on signing path" },
    { id = "RUSTSEC-2025-0111", reason = "transitive, no fixed upgrade available" },
]

# ---------------------------------------------------------------------------
# Licenses — AGPL-3.0-or-later for kalidoku.
# We allow permissive (MIT/Apache/BSD/ISC/MPL) deps and copyleft linking we
# already use (LGPL when dyn-linked / static-link OK under AGPL clause 13).
# ---------------------------------------------------------------------------
[licenses]
# SPDX expression confidence threshold. Anything below requires explicit listing.
confidence-threshold = 0.93
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "ISC",
    "MIT",
    "MIT-0",
    "MPL-2.0",
    "OpenSSL",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "Unlicense",
    "Zlib",
    # Allowed because kalidoku itself is AGPL-3.0-or-later and the binary is
    # never redistributed without source. Keep this list narrow.
    "AGPL-3.0",
    "AGPL-3.0-only",
    "AGPL-3.0-or-later",
    "GPL-3.0",
    "GPL-3.0-or-later",
    # CDLA-Permissive-2.0: Linux Foundation data license, MIT-equivalent.
    # Pulled in by webpki-roots (Mozilla CA bundle).
    "CDLA-Permissive-2.0",
]
# Per-crate exceptions (use if upstream uses a non-standard SPDX id).
exceptions = []

# ---------------------------------------------------------------------------
# Bans — block crates we don't want pulled in.
# ---------------------------------------------------------------------------
[bans]
multiple-versions = "warn"
wildcards = "deny"
highlight = "all"
workspace-default-features = "allow"
external-default-features = "allow"

# Disallow openssl pulls — we use rustls everywhere (cf. CLAUDE.md).
deny = [
    { name = "openssl", reason = "use rustls instead (rustls-tls feature on reqwest etc.)" },
    { name = "openssl-sys", reason = "use rustls instead" },
    # Avoid known abandoned/unmaintained crypto.
    { name = "ring", version = "<0.17", reason = "older ring versions had advisories; require >=0.17" },
]
# Allow-list crates that legitimately exist in multiple versions due to deep
# dependency trees (Tokio ecosystem).
skip = [
    # example:
    # { name = "syn", version = "=1.0" },
]
skip-tree = []

# ---------------------------------------------------------------------------
# Sources — only crates.io + a small allow-list of git deps if needed.
# ---------------------------------------------------------------------------
[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
