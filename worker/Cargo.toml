[package]
name        = "kalidoku-worker"
version.workspace     = true
edition.workspace     = true
rust-version.workspace = true
license.workspace     = true
authors.workspace     = true
description = "kalidoku grid generator — daily cron + on-demand jobs."

[[bin]]
name = "kalidoku-worker"
path = "src/main.rs"

[dependencies]
kalidoku-core = { path = "../core" }
tokio.workspace      = true
tracing.workspace    = true
tracing-subscriber.workspace = true
sea-orm.workspace    = true
serde.workspace      = true
serde_json.workspace = true
anyhow.workspace     = true
chrono.workspace     = true
tokio-cron-scheduler.workspace = true
clap.workspace       = true
redis.workspace      = true
deadpool-redis.workspace = true
sha2.workspace       = true
uuid.workspace       = true
dotenvy.workspace    = true

[dev-dependencies]
tempfile = "3"
# Integration-test helpers — temporary Postgres + reuse server migrator.
# Pinned locally rather than via the workspace because the root `Cargo.toml`
# is owned by agent E and may not (yet) declare these test crates.
testcontainers         = "0.23"
testcontainers-modules = { version = "0.11", features = ["postgres"] }
sea-orm-migration.workspace = true
kalidoku-server        = { path = "../server" }
tokio.workspace        = true
