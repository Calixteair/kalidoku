[workspace]
resolver = "2"
members = [
    "core",
    "server",
    "worker",
]

[workspace.package]
version     = "0.1.0"
edition     = "2021"
rust-version = "1.88"
license     = "AGPL-3.0-only"
authors     = ["Calixteair <reymond.calixte@gmail.com>"]
repository  = "https://github.com/Calixteair/kalidoku"
readme      = "README.md"

[workspace.dependencies]
# core (sync only — no async, no I/O dependencies)
serde       = { version = "1", features = ["derive"] }
serde_json  = "1"
thiserror   = "1"
anyhow      = "1"
chrono      = { version = "0.4", default-features = false, features = ["serde", "clock"] }
uuid        = { version = "1", features = ["serde", "v4", "v7"] }
rand        = { version = "0.8", features = ["std_rng"] }
unicode-normalization = "0.1"
geoutils    = "0.5"

# async runtime + tracing
tokio       = { version = "1", features = ["full"] }
tracing     = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# server
axum        = { version = "0.7", features = ["macros", "tracing"] }
axum-extra  = { version = "0.9", features = ["cookie", "typed-header"] }
cookie      = "0.18"
urlencoding = "2"
tower       = "0.5"
tower-http  = { version = "0.6", features = ["trace", "cors", "compression-gzip", "set-header", "timeout"] }
tower_governor = "0.4"
hyper       = "1"

# DB
sea-orm     = { version = "1.1", features = ["sqlx-postgres", "runtime-tokio-rustls", "macros", "with-uuid", "with-chrono", "with-json"] }
sea-orm-migration = { version = "1.1", features = ["sqlx-postgres", "runtime-tokio-rustls"] }

# Cache (Valkey/Redis)
redis       = { version = "0.27", features = ["tokio-comp", "connection-manager"] }
deadpool-redis = "0.18"

# Auth (OIDC Keycloak)
openidconnect = "3"
jsonwebtoken  = "9"
argon2        = "0.5"  # only for legacy admin local accounts (Keycloak handles users)

# Altcha PoW verification (invisible client-side proof-of-work)
# Server signs a challenge with HMAC-SHA256, client brute-forces a small hash, server verifies.
# No third-party service. Spec: https://altcha.org/docs/v2/proof-of-work/
hex         = "0.4"

# HMAC (play tokens, duel signatures, session-id hashing)
hmac        = "0.12"
sha2        = "0.10"
base64      = "0.22"
constant_time_eq = "0.3"

# HTTP client (Keycloak, hCaptcha)
reqwest     = { version = "0.12", features = ["json", "rustls-tls", "gzip"], default-features = false }

# Worker scheduling
tokio-cron-scheduler = "0.13"

# CLI parser # agent-a # agent-b
clap        = { version = "4", features = ["derive", "env"] }

# Misc
once_cell   = "1"
dotenvy     = "0.15"
config      = { version = "0.14", default-features = false, features = ["toml", "yaml"] }
url         = "2"

[profile.release]
lto       = "fat"
codegen-units = 1
strip     = "symbols"
panic     = "abort"
opt-level = 3

[profile.release-with-debug]
inherits  = "release"
strip     = "none"
debug     = true
