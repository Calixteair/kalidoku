server {
  listen      80;
  server_name _;
  root        /usr/share/nginx/html;
  index       index.html;

  # gzip for static assets
  gzip                on;
  gzip_comp_level     6;
  gzip_min_length     1024;
  gzip_proxied        any;
  gzip_types          text/plain text/css text/javascript application/javascript application/json image/svg+xml application/manifest+json;

  # cache long for hashed assets
  location ~* \.(?:js|css|woff2?|svg|png|jpg|jpeg|webp|ico)$ {
    expires      365d;
    access_log   off;
    add_header   Cache-Control "public, immutable";
  }

  # never cache HTML
  location ~* \.html$ {
    expires      -1;
    add_header   Cache-Control "no-cache, no-store, must-revalidate";
  }

  # PWA manifest + service worker
  location = /sw.js                  { expires -1; add_header Cache-Control "no-cache"; }
  location = /manifest.webmanifest   { expires 1h; add_header Cache-Control "public"; }

  # health probe
  location = /healthz                { return 200 "ok\n"; access_log off; }

  # SPA-ish fallback for client-rendered routes
  location / {
    try_files $uri $uri/index.html /index.html;
  }
}
