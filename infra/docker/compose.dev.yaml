# docker-compose.dev.yaml — local dev infra (Postgres + Valkey + Meilisearch).
# The Rust binaries and the front are run on the host (cargo watch / pnpm dev).
# Secrets here are intentionally weak: NEVER use these creds in production.

name: kalidoku-dev

services:
  postgres:
    image: postgres:16.6-alpine
    environment:
      POSTGRES_DB: kalidoku
      POSTGRES_USER: kalidoku
      POSTGRES_PASSWORD: devpassword
    ports: ["5432:5432"]
    volumes: [pg-dev:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kalidoku -d kalidoku"]
      interval: 5s

  valkey:
    image: valkey/valkey:7.2-alpine
    command: ["valkey-server", "--requirepass", "devpassword"]
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD-SHELL", "valkey-cli -a devpassword ping | grep -q PONG"]
      interval: 5s

  # Meilisearch — backs autocomplete on the host-side server (cargo run).
  # Run with MEILI_URL=http://127.0.0.1:7700 MEILI_MASTER_KEY=devmeilikey.
  # The same key is hardcoded weak here; rotated via Bao in compose.yaml.
  search:
    image: getmeili/meilisearch:v1.11
    environment:
      MEILI_MASTER_KEY: devmeilikey
      MEILI_ENV: development
      MEILI_NO_ANALYTICS: "true"
    ports: ["7700:7700"]
    volumes: [meili-dev:/meili_data]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:7700/health | grep -q available"]
      interval: 10s
      timeout: 3s
      retries: 5

volumes:
  pg-dev:
  meili-dev:
